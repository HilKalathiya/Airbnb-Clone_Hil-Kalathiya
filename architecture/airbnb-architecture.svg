<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" width="1000" height="1100" style="background-color: #F7F9FC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF" />
    </marker>
    <!-- Shadow filter -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Main Title -->
  <text x="500" y="60" font-size="32" font-weight="800" text-anchor="middle" fill="#222222">Airbnb Clone Production Architecture</text>
  <text x="500" y="90" font-size="16" fill="#717171" text-anchor="middle">Scalable Global Vacation Rental Marketplace Strategy</text>

  <!-- ==================== ARROWS ==================== -->
  
  <!-- User to Edge -->
  <path d="M 500 190 L 500 235" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Edge to Frontend -->
  <path d="M 500 350 L 500 395" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Frontend to Microservices -->
  <path d="M 500 510 L 500 555" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Microservices to Data -->
  <path d="M 210 650 L 210 715" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 400 650 L 400 715" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 590 650 L 590 715" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 780 650 L 780 715" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Microservices to Async -->
  <path d="M 500 650 L 500 875" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,6" marker-end="url(#arrow)" />


  <!-- ==================== USERS ==================== -->
  <rect x="400" y="130" width="200" height="60" rx="30" fill="#E31C5F" filter="url(#drop-shadow)"/>
  <text x="500" y="166" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Web &amp; Mobile Clients</text>

  <!-- ==================== EDGE LAYER ==================== -->
  <rect x="100" y="240" width="800" height="110" rx="16" fill="#ffffff" stroke="#E5E7EB" stroke-width="2" filter="url(#drop-shadow)"/>
  <text x="120" y="270" font-weight="700" font-size="14" fill="#6B7280" letter-spacing="1">EDGE NETWORK</text>

  <g transform="translate(130, 280)">
    <rect x="0" y="0" width="220" height="50" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
    <text x="110" y="30" font-size="14" fill="#374151" text-anchor="middle" font-weight="600">CDN (Cloudflare)</text>
  </g>

  <g transform="translate(390, 280)">
    <rect x="0" y="0" width="220" height="50" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
    <text x="110" y="30" font-size="14" fill="#374151" text-anchor="middle" font-weight="600">Web Application Firewall</text>
  </g>

  <g transform="translate(650, 280)">
    <rect x="0" y="0" width="220" height="50" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
    <text x="110" y="30" font-size="14" fill="#374151" text-anchor="middle" font-weight="600">Global Load Balancer</text>
  </g>


  <!-- ==================== FRONTEND LAYER ==================== -->
  <rect x="100" y="400" width="800" height="110" rx="16" fill="#ffffff" stroke="#E5E7EB" stroke-width="2" filter="url(#drop-shadow)"/>
  <text x="120" y="430" font-weight="700" font-size="14" fill="#6B7280" letter-spacing="1">FRONTEND &amp; API LAYER</text>

  <g transform="translate(260, 440)">
    <rect x="0" y="0" width="220" height="50" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
    <text x="110" y="30" font-size="14" fill="#1E3A8A" text-anchor="middle" font-weight="700">Next.js SSR Clusters</text>
  </g>

  <g transform="translate(520, 440)">
    <rect x="0" y="0" width="220" height="50" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
    <text x="110" y="30" font-size="14" fill="#1E3A8A" text-anchor="middle" font-weight="700">GraphQL BFF Gateway</text>
  </g>


  <!-- ==================== MICROSERVICES ==================== -->
  <rect x="100" y="560" width="800" height="90" rx="16" fill="#ffffff" stroke="#E5E7EB" stroke-width="2" filter="url(#drop-shadow)"/>
  <text x="120" y="590" font-weight="700" font-size="14" fill="#6B7280" letter-spacing="1">BACKEND CORE MICROSERVICES (KUBERNETES)</text>

  <g transform="translate(130, 575)">
    <rect x="0" y="30" width="160" height="45" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
    <text x="80" y="58" font-size="14" fill="#065F46" text-anchor="middle" font-weight="700">Auth Service</text>
  </g>

  <g transform="translate(320, 575)">
    <rect x="0" y="30" width="160" height="45" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
    <text x="80" y="58" font-size="14" fill="#065F46" text-anchor="middle" font-weight="700">Listing Service</text>
  </g>

  <g transform="translate(510, 575)">
    <rect x="0" y="30" width="160" height="45" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
    <text x="80" y="58" font-size="14" fill="#065F46" text-anchor="middle" font-weight="700">Booking Service</text>
  </g>

  <g transform="translate(700, 575)">
    <rect x="0" y="30" width="160" height="45" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
    <text x="80" y="58" font-size="14" fill="#065F46" text-anchor="middle" font-weight="700">Search Service</text>
  </g>


  <!-- ==================== DATABASES & STORAGE ==================== -->
  <rect x="100" y="720" width="800" height="110" rx="16" fill="#ffffff" stroke="#E5E7EB" stroke-width="2" filter="url(#drop-shadow)"/>
  <text x="120" y="750" font-weight="700" font-size="14" fill="#6B7280" letter-spacing="1">DATA &amp; STORAGE TIER</text>

  <!-- DB Cylinders -->
  <g transform="translate(130, 755)">
    <rect x="0" y="15" width="160" height="50" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2"/>
    <text x="80" y="38" font-size="13" fill="#92400E" text-anchor="middle" font-weight="700">PostgreSQL</text>
    <text x="80" y="54" font-size="11" fill="#B45309" text-anchor="middle">Transactions</text>
  </g>

  <g transform="translate(320, 755)">
    <rect x="0" y="15" width="160" height="50" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2"/>
    <text x="80" y="38" font-size="13" fill="#92400E" text-anchor="middle" font-weight="700">MongoDB / Redis</text>
    <text x="80" y="54" font-size="11" fill="#B45309" text-anchor="middle">Listings &amp; Cache</text>
  </g>

  <g transform="translate(510, 755)">
    <rect x="0" y="15" width="160" height="50" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2"/>
    <text x="80" y="38" font-size="13" fill="#92400E" text-anchor="middle" font-weight="700">AWS S3</text>
    <text x="80" y="54" font-size="11" fill="#B45309" text-anchor="middle">Media &amp; Assets</text>
  </g>

  <g transform="translate(700, 755)">
    <rect x="0" y="15" width="160" height="50" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2"/>
    <text x="80" y="38" font-size="13" fill="#92400E" text-anchor="middle" font-weight="700">Elasticsearch</text>
    <text x="80" y="54" font-size="11" fill="#B45309" text-anchor="middle">Geospatial Queries</text>
  </g>


  <!-- ==================== ASYNC PROCESSING ==================== -->
  <rect x="100" y="880" width="800" height="110" rx="16" fill="#ffffff" stroke="#E5E7EB" stroke-width="2" filter="url(#drop-shadow)"/>
  <text x="120" y="910" font-weight="700" font-size="14" fill="#6B7280" letter-spacing="1">EVENT STREAMING &amp; ASYNC WORKERS</text>

  <g transform="translate(260, 920)">
    <rect x="0" y="0" width="220" height="50" rx="8" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="2"/>
    <text x="110" y="30" font-size="14" fill="#6B21A8" text-anchor="middle" font-weight="700">Apache Kafka (Event Bus)</text>
  </g>

  <g transform="translate(520, 920)">
    <rect x="0" y="0" width="220" height="50" rx="8" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="2"/>
    <text x="110" y="30" font-size="14" fill="#6B21A8" text-anchor="middle" font-weight="700">Async Worker Nodes</text>
  </g>

</svg>
